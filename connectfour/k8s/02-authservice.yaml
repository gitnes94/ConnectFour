apiVersion: apps/v1
kind: Deployment
metadata:
  name: authservice
  namespace: connectfour
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authservice
  template:
    metadata:
      labels:
        app: authservice
    spec:
      containers:
        - name: authservice
          image: connectfour/authservice:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: authservice
  namespace: connectfour
spec:
  selector:
    app: authservice
  ports:
    - port: 9000
      targetPort: 9000
