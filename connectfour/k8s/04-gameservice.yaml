apiVersion: apps/v1
kind: Deployment
metadata:
  name: gameservice
  namespace: connectfour
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gameservice
  template:
    metadata:
      labels:
        app: gameservice
    spec:
      containers:
        - name: gameservice
          image: connectfour/gameservice:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: http://authservice:9000/jwks
            # RabbitMQ reached by its Service DNS name
            - name: SPRING_RABBITMQ_HOST
              value: rabbitmq
            # gRPC target = User Service's gRPC port, by DNS name
            - name: SPRING_GRPC_CLIENT_CHANNELS_USERSERVICE_ADDRESS
              value: static://userservice:9090
---
apiVersion: v1
kind: Service
metadata:
  name: gameservice
  namespace: connectfour
spec:
  selector:
    app: gameservice
  ports:
    - port: 8083
      targetPort: 8083
