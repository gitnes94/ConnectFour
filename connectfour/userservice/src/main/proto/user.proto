syntax = "proto3";

option java_multiple_files = true;
option java_package = "com.example.userservice.grpc.proto";
option java_outer_classname = "UserProto";

package user;

// Service that Game Service calls over gRPC to resolve player info.
service UserGrpcService {
  // Fetch a single player's public profile by id.
  rpc GetPlayer (GetPlayerRequest) returns (PlayerReply);
}

message GetPlayerRequest {
  string user_id = 1;
}

message PlayerReply {
  string user_id = 1;
  string username = 2;
  string display_name = 3;
  int32 wins = 4;
  int32 losses = 5;
  bool found = 6;
}
