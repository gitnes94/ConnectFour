spring.application.name=userservice
server.port=8082

# --- JWT resource server: validate tokens against Auth Service's public keys ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/jwks

# --- Own database (UserDB): file-based H2 so data survives restarts ---
spring.datasource.url=jdbc:h2:file:./data/userdb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- gRPC server port (Game Service connects here) ---
grpc.server.port=9090
