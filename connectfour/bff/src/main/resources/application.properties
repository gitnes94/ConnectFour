spring.application.name=bff
server.port=8080

# --- Validate JWTs against Auth Service's public keys ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/jwks

# --- Downstream service URLs (overridden to cluster DNS names in k8s) ---
services.auth-url=http://localhost:9000
services.user-url=http://localhost:8082
services.game-url=http://localhost:8083
