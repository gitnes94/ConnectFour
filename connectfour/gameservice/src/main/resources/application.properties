spring.application.name=gameservice
server.port=8083

# --- JWT resource server ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9000/jwks

# --- Own database (GameDB) ---
spring.datasource.url=jdbc:h2:file:./data/gamedb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- RabbitMQ connection ---
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# --- gRPC client: where User Service's gRPC server lives ---
spring.grpc.client.channels.userservice.address=static://localhost:9090
spring.grpc.client.channels.userservice.negotiation-type=plaintext
